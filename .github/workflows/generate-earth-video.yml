name: Generate Earth Rotation Video
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'
      - 'scripts/render_earth_video.py'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencv-python-headless numpy
      - run: python scripts/render_earth_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: earth-rotation-video
          path: output/earth_rotation.mp4
